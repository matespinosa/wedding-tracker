<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1ec" />
    <meta name="description" content="Organizador compartido de tareas, invitados y detalles de nuestra boda." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nuestra boda" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Nuestra boda</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
        const path = location.pathname.endsWith("/")
          ? location.pathname
          : location.pathname.slice(0, location.pathname.lastIndexOf("/") + 1);
        navigator.serviceWorker.register(`${path}sw.js`, { scope: path }).catch(() => undefined);
      }
    </script>
  </body>
</html>
